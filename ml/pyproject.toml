[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aranya-ml"
version = "0.1.0"
description = "Dataset, training, evaluation, and export tools for ARANYA acoustic detection."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib>=1.3,<2",
  "librosa>=0.10,<1",
  "numpy>=1.26,<3",
  "pandas>=2,<4",
  "pyyaml>=6,<7",
  "resampy>=0.4,<1",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "soundfile>=0.12,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
tensorflow = [
  "tensorflow==2.19.0",
  "tf-keras==2.19.0",
]
plots = [
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
]

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aranya_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
